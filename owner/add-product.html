<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Add Product — Shop Owner — DATIHAN.PH</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/global.css"><link rel="stylesheet" href="../css/page.css"></head><body><main class="page-main"><header class="page-header"><p class="eyebrow">SHOP OWNER</p><h1>Add a product.</h1><p>The product fields will be mapped to your Supabase schema later.</p></header><form class="form-grid"><div class="field"><label for="name">Product name</label><input id="name" type="text"></div><div class="field"><label for="price">Price</label><input id="price" type="number" min="0" step="0.01"></div><div class="field"><label for="size">Size</label><input id="size" type="text"></div><div class="field"><label for="condition">Condition</label><select id="condition"><option>Select condition</option><option>Excellent</option><option>Good</option><option>Fair</option></select></div><div class="field"><label for="description">Description</label><textarea id="description" rows="6"></textarea></div><button class="button button-primary" type="button">Save product</button></form></main></body></html>
