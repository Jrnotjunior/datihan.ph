<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — DATIHAN.PH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/page.css">
  <link rel="stylesheet" href="cart.css?v=2">
</head>
<body>
  <main class="cart-main">
    <header class="cart-header"><p class="eyebrow">YOUR CART</p><h1>Your finds, ready to go.</h1></header>
    <div class="cart-layout" id="cart-content">
      <section class="cart-items" aria-label="Cart items"></section>
      <aside class="summary"><h2>Summary</h2><div class="summary-row"><span>Selected subtotal</span><strong id="subtotal">₱0</strong></div><div class="summary-row"><span>Shipping</span><strong>Calculated at checkout</strong></div><div class="summary-row summary-total"><span>Total</span><strong id="total">₱0</strong></div><a class="button button-primary" href="checkout.html">Proceed to checkout <span class="button-icon" aria-hidden="true">→</span></a><a class="continue-shopping" href="shop.html">← Continue shopping</a></aside>
    </div>
    <section class="empty-cart" id="empty-cart"><h2>Your cart is empty.</h2><p>Find something you love and it can be here.</p><a class="button button-primary" href="shop.html">Browse the collection <span class="button-icon" aria-hidden="true">→</span></a></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/cart-store.js"></script>
  <script src="../js/global.js" defer></script>
  <script src="../js/cart.js?v=2" defer></script>
</body>
</html>
