<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Create Account — DATIHAN.PH</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/global.css"><link rel="stylesheet" href="../css/page.css"><link rel="stylesheet" href="register.css"></head><body><main class="auth-main"><section class="auth-card"><p class="eyebrow">DATIHAN.PH</p><h1>Create your account.</h1><p class="auth-intro">Join DATIHAN.PH to keep your details and orders in one place.</p><form id="register-form" novalidate><div class="form-row"><div class="field"><label for="first-name">First name</label><input id="first-name" name="firstName" type="text" autocomplete="given-name" required></div><div class="field"><label for="last-name">Last name</label><input id="last-name" name="lastName" type="text" autocomplete="family-name" required></div></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password</label><div class="password-wrap"><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required><button class="password-toggle" type="button" data-target="password" aria-label="Show password">Show</button></div><p class="field-hint">Use at least 8 characters.</p></div><div class="field"><label for="confirm-password">Confirm password</label><div class="password-wrap"><input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required><button class="password-toggle" type="button" data-target="confirm-password" aria-label="Show password">Show</button></div></div><label class="consent-field"><input id="privacy-consent" name="privacyConsent" type="checkbox" required><span>I have read and agree to the <a href="../pages/privacy-policy.html" target="_blank" rel="noopener">Privacy Policy</a>.</span></label><p id="form-message" class="form-message" role="alert" aria-live="polite"></p><button class="button button-primary auth-submit" type="submit" disabled>Create account <span class="button-icon" aria-hidden="true">→</span></button></form><p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-client.js"></script><script src="../js/global.js" defer></script><script src="register.js" defer></script></body></html>
