<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users — Admin — DATIHAN.PH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/page.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/admin-users.css">
</head>
<body>
  <main class="page-main admin-users" data-admin-users>
    <nav class="admin-nav admin-subnav" aria-label="Admin navigation">
      <a class="admin-back-link" href="dashboard.html" aria-label="Back to admin dashboard">← Dashboard</a>
      <div class="dashboard-nav-links">
        <a href="users.html" aria-current="page">Users</a>
        <a href="shops.html">Shops</a>
        <a href="products.html">Products</a>
        <a href="orders.html">Orders</a>
      </div>
      <a class="admin-account-button" href="profile.html" aria-label="Profile" title="Profile">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.2"></circle><path d="M5.8 19.2a6.2 6.2 0 0 1 12.4 0"></path></svg>
      </a>
    </nav>
    <header class="page-header">
      <p class="eyebrow">ADMIN</p>
      <h1>Users.</h1>
      <p>View every platform account and its assigned role.</p>
    </header>
    <section aria-labelledby="users-heading">
      <div class="admin-users-toolbar">
        <div><h2 id="users-heading">All accounts</h2><p class="admin-users-status" data-users-status>Loading users…</p></div>
        <label><span class="sr-only">Filter users by role</span><select class="admin-users-filter" data-users-filter><option value="all">All roles</option><option value="buyer">Buyers</option><option value="shop_owner">Shop owners</option><option value="admin">Admins</option></select></label>
      </div>
      <div class="admin-users-table-wrap">
        <table class="admin-users-table"><thead><tr><th>Account</th><th>Email</th><th>Role</th><th>Created</th></tr></thead><tbody data-users-body></tbody></table>
        <div class="admin-users-empty" data-users-empty hidden>No accounts match this filter.</div>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/auth-guard.js"></script>
  <script src="../js/admin-users.js"></script>
</body>
</html>
