    .admin-shop-table-wrap{overflow-x:auto;margin-top:1.5rem}.admin-shop-table{width:100%;border-collapse:collapse;min-width:720px}.admin-shop-table th,.admin-shop-table td{padding:1rem 1.1rem;text-align:left;border-bottom:1px solid var(--line,#dfd0c3)}.admin-shop-table th{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--brown)}.admin-shop-table td{color:var(--ink,#241d18)}.admin-shop-name{display:block;font-weight:700}.admin-shop-id{display:block;margin-top:.3rem;font-size:.72rem;color:var(--brown);word-break:break-all}.admin-shop-count{font-weight:700}.admin-shop-status{display:inline-flex;padding:.35rem .65rem;border-radius:999px;background:#dfcfbe;font-size:.78rem;font-weight:700}.admin-shop-empty{padding:2rem 0;color:var(--brown)}.admin-shop-error{margin-top:1rem;color:#8b3a2e}

<body><main class="page-main">
  <nav class="admin-nav admin-subnav" aria-label="Admin navigation">
